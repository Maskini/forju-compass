# Private GitHub repository; connect with Render's GitHub integration.
services:
  - type: web
    name: forju-compass
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -- --hostname 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: COMPASS_LOCAL_ONLY
        value: "true"
      - key: COMPASS_EMBED_ORIGINS
        value: https://forju.at,https://www.forju.at
      - key: FEEDBACK_DEMO_MODE
        value: "false"
      - key: FEEDBACK_TO_EMAIL
        value: adam.maskini@forju.at
      - key: FEEDBACK_FROM_EMAIL
        sync: false
      - key: COMPASS_ACCOUNT_TEST_MODE
        value: "false"
      - key: RESEND_API_KEY
        sync: false
